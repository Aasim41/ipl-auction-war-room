name: Build Android APK (AuctionXI Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Next.js Web Assets
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android || npx cap add android

      - name: Make Gradle Executable
        run: |
          cd frontend/android
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload AuctionXI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuctionXI-Android-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish Direct APK Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0-apk
          name: "AuctionXI Mobile App v1.0 (Android APK)"
          body: |
            ### 🏏 AuctionXI: IPL War Room & Simulator - Mobile App
            
            **Direct APK Download**:
            Download `app-debug.apk` below directly to your Android device to install and test the game.
            
            **Features included**:
            - ⚡ Full IPL 2026 Mega & Mini Auction War Room with live hammer bidding
            - 🔔 Randomized daily notifications for IPL news and trades
            - 📈 Autonomous background data ingestion & real-time international tours
            - 📋 Official BCCI RTM rules and retention slab deductions
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
