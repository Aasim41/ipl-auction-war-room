name: Build Android APK (AuctionXI Capacitor)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Next.js Web Assets
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd frontend
          npx cap sync android || npx cap add android

      - name: Make Gradle Executable
        run: |
          cd frontend/android
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd frontend/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Release Artifacts
        run: |
          mkdir -p release-apks
          cp frontend/android/app/build/outputs/apk/debug/*.apk release-apks/AuctionXI-debug.apk
          cp frontend/android/app/build/outputs/apk/debug/*.apk release-apks/AuctionXI-v1.0.apk
          ls -la release-apks/

      - name: Upload AuctionXI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuctionXI-Android-Debug-APK
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish Direct APK Download to GitHub Releases
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0-apk"
          TITLE="AuctionXI Mobile App v1.0 (Android APK)"

          cat << 'EOF' > release_notes.md
          ### 🏏 AuctionXI: IPL War Room & Tournament Arena (Official Android APK)

          **Direct APK Downloads**:
          - 📲 **[AuctionXI-v1.0.apk](https://github.com/Aasim41/ipl-auction-war-room/releases/download/v1.0.0-apk/AuctionXI-v1.0.apk)**
          - 🛠️ **[AuctionXI-debug.apk](https://github.com/Aasim41/ipl-auction-war-room/releases/download/v1.0.0-apk/AuctionXI-debug.apk)**

          Download either APK directly to your Android device to install and play the full game!

          **Championship Features Included**:
          - 🪙 **Interactive IPL Match Toss Ceremony**: Real 3D coin toss ceremony with Heads/Tails call and Bat/Bowl matchday election.
          - 🏏 **Dual Team Sheets (Bat-First vs Bowl-First)**: Toggle and optimize separate lineups with complementary 12th man Impact Players.
          - 🏟️ **Pitch & Venue Calibrated AI**: Wankhede pace bounce, Chepauk spin choke, Chinnaswamy boundary hitting, and Ekana cutters.
          - 🎯 **Tactical Rival Counters**: Exploits and neutralizes opponent strengths and weaknesses.
          - 📊 **Official 74-Match IPL Schedule & Live Points Table**: Real-time NRR and standings recomputed deterministically across all 10 teams.
          - 🔊 **Broadcast Stadium Audio**: Willow cracks, crowd roars, and stump shatter sound effects.
          - 🔨 **Mega & Mini Auction War Room**: Gavel bidding, RTM cards, and BCCI roster validation.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating notes and uploading APKs with --clobber..."
            gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md
            gh release upload "$TAG" release-apks/AuctionXI-v1.0.apk release-apks/AuctionXI-debug.apk --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" release-apks/AuctionXI-v1.0.apk release-apks/AuctionXI-debug.apk \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --latest
          fi
          echo "GitHub Release verified successfully with APK downloads!"
